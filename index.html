<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6ff;--card:#fff;--ink:#0d1530;--mute:#55607f;--line:#d7def2;--blue:#1d4ed8;--pop:#ffc233;--popink:#2a1d00;--bar:#e2e8fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1026;--card:#121a38;--ink:#eef2ff;--mute:#9aa6cc;--line:#26305a;--blue:#6e93ff;--bar:#1c2650;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1026;--card:#121a38;--ink:#eef2ff;--mute:#9aa6cc;--line:#26305a;--blue:#6e93ff;--bar:#1c2650;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "DM Sans",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 18px 60px}
.logo{width:84px;height:84px;border-radius:20px;display:block;margin-bottom:16px;border:2px solid var(--ink)}
h1,h2{font-family:"Bricolage Grotesque","DM Sans",sans-serif;line-height:1.05;margin:0}
h1{font-size:clamp(2.3rem,9vw,3.4rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.4rem;margin-bottom:12px}
.by{color:var(--mute);margin:10px 0 22px}
.story{font-size:1.05rem;max-width:60ch}
.meter{margin:28px 0;padding:20px;background:var(--card);border:2px solid var(--ink);border-radius:18px}
.amt{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2rem}
.amt small{font-size:1rem;font-weight:600;color:var(--mute)}
.track{height:18px;background:var(--bar);border-radius:99px;overflow:hidden;margin:12px 0 8px}
.fill{height:100%;width:0;background:var(--pop);border-radius:99px;transition:width 1.2s ease}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.9rem}
.pay{background:var(--blue);color:#fff;border-radius:18px;padding:22px;margin-bottom:34px}
:root[data-theme="dark"] .pay{color:#0a1026}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pay{color:#0a1026}}
.pay h2{margin-bottom:4px}
.pay p{margin:0 0 16px;opacity:.9}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid rgba(255,255,255,.3)}
:root[data-theme="dark"] .row{border-color:rgba(10,16,38,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .row{border-color:rgba(10,16,38,.25)}}
.row span{opacity:.85;font-size:.9rem}
.row b{font-size:1.15rem;word-break:break-all;text-align:right}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.copy{background:var(--pop);color:var(--popink);width:100%;margin-top:6px}
.wa{background:transparent;color:inherit;border:2px solid currentColor;width:100%;margin-top:10px}
button:focus-visible,.btn:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.post{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.post time{color:var(--mute);font-size:.85rem}
.post p{margin:6px 0 0}
.sup{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.empty{color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.fill,.toast{transition:none}}
</style>
</head>

function esc(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }

$("title").textContent = CFG.title;
